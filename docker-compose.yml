services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-secret-key-change-me}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
      DATABASE_URL: postgres://awd:awd@db:5432/awd
      MEDIA_ROOT: /app/media
      GRAPHIQL: "true"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Runs the AWD rule check every 6 hours (opens/resolves alerts).
  scheduler:
    build: .
    command: >
      sh -c "while true; do python manage.py awd_check; sleep 21600; done"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-secret-key-change-me}
      DATABASE_URL: postgres://awd:awd@db:5432/awd
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: awd
      POSTGRES_PASSWORD: awd
      POSTGRES_DB: awd
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awd -d awd"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  media:
